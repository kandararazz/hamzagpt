<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HamzaGPT | Sassy AI Answers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/jpeg" href="logo.jpg">
</head>
<body class="theme-white">

  <!-- 2-Second Splash Loading Screen -->
  <div id="splashLoader" class="splash-screen">
    <div class="splash-content">
      <img src="logo.jpg" alt="HamzaGPT Logo" class="splash-logo">
      <div class="splash-bar">
        <div class="splash-bar-fill"></div>
      </div>
      <p class="splash-tagline">Loading HamzaGPT...</p>
    </div>
  </div>

  <div class="chat-app">
    
    <!-- Clean Header with Big Logo and Buy Premium Button -->
    <header class="app-header">
      <div class="brand">
        <img src="logo.jpg" alt="HamzaGPT Logo" class="brand-logo">
        <h1 class="brand-title">HamzaGPT</h1>
      </div>

      <div class="header-right">
        <!-- Buy Premium Button (Navigates to premium.html) -->
        <a href="premium.html" class="buy-premium-nav-btn" title="Get HamzaGPT Premium">
          <span class="premium-sparkle">✨</span>
          <span class="premium-btn-label">Buy Premium</span>
        </a>
      </div>
    </header>

    <!-- Main Chat Messages Area -->
    <main class="chat-area" id="chatArea">
      <div class="messages" id="messagesList">
        
        <!-- Welcome Center Box -->
        <div class="welcome-box" id="welcomeBox">
          <div class="welcome-logo-wrap">
            <img src="logo.jpg" alt="HamzaGPT" class="welcome-logo">
          </div>
          <h2>What can I roast for you today?</h2>
          <p>Ask literally anything. You get an accurate, meaningful answer and a funny, sarcastic roast.</p>
          
          <div class="welcome-prompts">
            <button class="welcome-pill" data-q="Why is the sky blue?">🔬 Why is the sky blue?</button>
            <button class="welcome-pill" data-q="Should I text my ex right now?">📱 Should I text my ex?</button>
            <button class="welcome-pill" data-q="How do I center a div in CSS?">💻 How do I center a div?</button>
            <button class="welcome-pill" data-q="Why am I always tired?">🥱 Why am I always tired?</button>
          </div>
        </div>

      </div>

      <!-- Typing Indicator -->
      <div class="typing-indicator" id="typingIndicator" style="display: none;">
        <div class="typing-avatar">😏</div>
        <div class="typing-pill">
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
          <span id="typingStatusText">Thinking of a witty answer...</span>
        </div>
      </div>
    </main>

    <!-- Bottom Clean Input Form (ChatGPT Style) -->
    <footer class="app-footer">
      <form id="chatForm" class="chat-input-form">
        <div class="input-box">
          <textarea 
            id="userInput" 
            placeholder="Ask HamzaGPT a question..." 
            rows="1" 
            maxlength="500" 
            required></textarea>
          
          <button type="submit" id="sendBtn" class="send-btn" title="Send question">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </form>
      <div class="footer-note">HamzaGPT delivers 10% facts and 90% unprovoked attitude.</div>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
